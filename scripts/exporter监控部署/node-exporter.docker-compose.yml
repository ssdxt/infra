name: monitor

services:

  # ---------------------------------------------------------------------------
  # node-exporter —— 主机指标采集（CPU / 内存 / 磁盘 / 网络 / 文件系统）
  #
  # 说明: 单独使用 node-exporter 时用本文件；昇腾机器请用同级的
  #       npu-exporter/docker-compose.yml（那个文件同时包含 npu-exporter 的说明）。
  #
  # 为什么必须 host 网络 + host PID:
  #   否则 network / process 类采集器拿到的是容器自己的命名空间，不是宿主机的。
  #
  # 启动: cd /deploy/infra/monitor && docker-compose up -d
  #   （本机 docker compose 子命令不可用，需用独立二进制 docker-compose v2.29.7）
  # ---------------------------------------------------------------------------
  node-exporter:
    image: swr.cn-north-4.myhuaweicloud.com/ddn-k8s/quay.io/prometheus/node-exporter:v1.9.1-linuxarm64
    container_name: node-exporter
    restart: unless-stopped
    network_mode: host
    pid: host
    security_opt:
      - label=disable
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    command:
      - --path.procfs=/host/proc
      - --path.sysfs=/host/sys
      - --path.rootfs=/rootfs
      # compose 里字面量 $ 必须写成 $$，否则会被当成变量插值
      - "--collector.filesystem.mount-points-exclude=^/(dev|proc|run/credentials/.+|sys|var/lib/docker/.+|var/lib/containers/storage/.+)($$|/)"

    # 其他架构 / 镜像源可换成:
    #   prom/node-exporter:v1.9.1              (x86_64)
    #   quay.io/prometheus/node-exporter:v1.9.1-linuxarm64  (本文件所用)
