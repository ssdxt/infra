# 8376 HTTPS 服务; http 明文请求通过 497 自动跳转 https
server {
    listen 8376 ssl;
    client_max_body_size 1000M;
    ssl_certificate /etc/nginx/ssl/cert.pem;
    ssl_certificate_key /etc/nginx/ssl/key.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    error_page 497 https://$host:8376$request_uri;

    root /usr/share/nginx/html;
    index index.html;

    location  / {
        root html/omniknow/ ;
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    # 兼容：前端带 space_id 的音频转写 → ai_server 端点为 /api/v1/audio/transcribe（无 space 段）
    location ~ "^/backend/api/v1/spaces/[^/]+/audio/transcribe$" {
        rewrite "^/backend/api/v1/spaces/[^/]+/audio/transcribe$" /api/v1/audio/transcribe break;
        proxy_pass http://172.18.0.131:8375;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 100M;
        proxy_read_timeout 300s;
    }

    location /knowledge_api/ {
        proxy_pass http://172.18.0.130:8366/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /backend/ {
        proxy_pass http://172.18.0.131:8375/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    location /api/ {
        proxy_pass http://172.18.0.131:8375;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /knowledge2_api/ {
        proxy_pass http://172.18.0.114:18081/;
        proxy_ssl_verify off;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_cache off;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 3600s;
    }
}
