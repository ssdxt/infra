  backupTarget: null
  backupTargetCredentialSecret: null
  pollInterval: null
privateRegistry:
  createSecret: null
  registryUrl: null
  registryUser: null
  registryPasswd: null
  registrySecret: null
longhornManager:
  log:
    format: plain
  priorityClass: longhorn-critical
  tolerations: []
  nodeSelector: {}
  serviceAnnotations: {}
longhornDriver:
  log:
    format: plain
  priorityClass: longhorn-critical
  tolerations: []
  nodeSelector: {}
longhornUI:
  replicas: 2
  priorityClass: longhorn-critical
  affinity:
    podAntiAffinity:
      preferredDuringSchedulingIgnoredDuringExecution:
      - weight: 1
        podAffinityTerm:
          labelSelector:
            matchExpressions:
            - key: app
              operator: In
              values:
              - longhorn-ui
          topologyKey: kubernetes.io/hostname
  tolerations: []
  nodeSelector: {}
ingress:
  enabled: false
  ingressClassName: null
  host: sslip.io
  tls: false
  secureBackends: false
  tlsSecret: longhorn.local-tls
  path: /
  pathType: ImplementationSpecific
  annotations: null
  secrets: null
enablePSP: false
namespaceOverride: ''
annotations: {}
serviceAccount:
  annotations: {}
metrics:
  serviceMonitor:
    enabled: false
    additionalLabels: {}
    annotations: {}
    interval: ''
    scrapeTimeout: ''
    relabelings: []
    metricRelabelings: []
openshift:
  enabled: false
  ui:
    route: longhorn-ui
    port: 443
    proxy: 8443
enableGoCoverDir: false
extraObjects: []
