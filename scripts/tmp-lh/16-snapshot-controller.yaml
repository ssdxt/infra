apiVersion: apps/v1
kind: Deployment
metadata:
  name: snapshot-controller
  namespace: longhorn-system
  labels:
    app: snapshot-controller
spec:
  replicas: 2
  selector:
    matchLabels:
      app: snapshot-controller
  strategy:
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
  template:
    metadata:
      labels:
        app: snapshot-controller
    spec:
      serviceAccountName: longhorn-service-account
      priorityClassName: longhorn-critical
      containers:
      - name: snapshot-controller
        image: harbor.wuxing.local/longhorn/snapshot-controller:v8.0.1
        args:
        - --v=2
        - --leader-election=true
        - --leader-election-namespace=longhorn-system
        - --enable-distributed-snapshotting=false
