version: '3.7'

services:
  agent:
    image: portainer/agent:2.20.0
    container_name: portainer-agent
    restart: always
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /var/lib/docker/volumes:/var/lib/docker/volumes
    deploy:
      mode: global
    networks:
      - cc-net

  portainer:
    image: portainer/portainer-ce:2.20.0
    container_name: portainer
    restart: always
    ports:
      - 9001:9000
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./data/czy/portainer_data:/data
    networks:
      - cc-net


networks:
  cc-net:
     external: true
