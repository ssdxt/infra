    server {
        listen       8378;
        server_name  _;

        access_log  logs/_space_$logdate.log  main;

        gzip on;
        gzip_buffers 32 4K;
        gzip_comp_level 6;
        gzip_min_length 100;
        gzip_types text/plain application/javascript application/x-javascript text/css application/xml text/xml text/javascript application/json;
        gzip_disable "MSIE [1-6]\.";
        gzip_vary on;


        # MinIO 对象存储同源代理（bucket 路径 -> minio:9000）
        location ~ "^/[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}/(images|logo|documents|processed|chunks|media|source)/" {
            proxy_pass http://minio:9000;
            proxy_set_header Host $host;
        }
        location ~ "^/(public|ccaibucket)/" {
            proxy_pass http://minio:9000;
            proxy_set_header Host $host;
        }

        location  / {
            root html/omniknow/ ;
            index index.html;
            try_files $uri $uri/ /index.html;
        }

    location /knowledge_api/ {
        proxy_pass http://assistant:8366/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    
    location /backend/ {
        proxy_pass http://ai_server:8375/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    
    error_page   500 502 503 504  /50x.html;
    location = /50x.html {
        root   /html;
    }

 }


