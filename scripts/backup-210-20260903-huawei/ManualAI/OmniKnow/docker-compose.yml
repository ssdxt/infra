services:
  mysql:
    image: mysql:8.0.45
    container_name: cc-mysql
    privileged: true
    restart: always
    volumes:
      - ./data/mysql/data:/var/lib/mysql
    environment:
      TZ: Asia/Shanghai    
      MYSQL_ROOT_PASSWORD: W2pLIKgtWz4XunL9pja
      LANG: C.UTF-8 
    command:
      --group_concat_max_len=102400
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_general_ci
      --sql-mode="STRICT_TRANS_TABLES,NO_ZERO_IN_DATE,NO_ZERO_DATE,ERROR_FOR_DIVISION_BY_ZERO,NO_ENGINE_SUBSTITUTION"
    ports:
      - "3306:3306"    
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-uroot", "-p$$MYSQL_ROOT_PASSWORD"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 10s 
    networks:
      - cc-net

  redis:
    image: redis:8.6.2
    container_name: cc-redis
    privileged: true
    restart: always
    volumes:
      - ./data/redis:/data
    networks:
      - cc-net
    ports:
      - 6379:6379
    command: redis-server --port 6379 --requirepass zxcde@1 --appendonly yes

  minio:
    image: minio/minio:RELEASE.2024-03-15T01-07-19Z 
    container_name: minio
    privileged: true
    restart: always
    ports:
      - "9000:9000"
      - "9090:9090"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: EVXLpUtzthgyHpI1*ex
      TZ: Asia/Shanghai
    volumes:
      - ./data/minio/data:/data
    command: server --console-address ":9090" /data
    networks:
      - cc-net

  etcd:
    image: quay.io/coreos/etcd:v3.5.25
    container_name: milvus-etcd
    networks:
      - cc-net
    environment:
      - ETCD_AUTO_COMPACTION_MODE=revision
      - ETCD_AUTO_COMPACTION_RETENTION=1000
      - ETCD_QUOTA_BACKEND_BYTES=4294967296
      - ETCD_SNAPSHOT_COUNT=50000
    volumes:
      - ./data/etcd:/etcd
    command: etcd -advertise-client-urls=http://etcd:2379 -listen-client-urls http://0.0.0.0:2379 --data-dir /etcd
    healthcheck:
      test: ["CMD", "etcdctl", "endpoint", "health"]
      interval: 30s
      timeout: 20s
      retries: 3

  milvus:
    image: milvusdb/milvus:v2.6.13
    container_name: milvus-standalone
    restart: always
    command: ["milvus", "run", "standalone"]
    networks:
      - cc-net
    environment:
      TZ: Asia/Shanghai
      MILVUS_LOG_LEVEL: info
      DEPLOY_MODE: STANDALONE
      ETCD_USE_EMBED: "true"
      ETCD_DATA_DIR: /var/lib/milvus/etcd
      ETCD_CONFIG_PATH: /milvus/configs/embedEtcd.yaml
      MINIO_ADDRESS: minio:9000
      MINIO_ACCESS_KEY_ID: minioadmin
      MINIO_SECRET_ACCESS_KEY: EVXLpUtzthgyHpI1*ex 
      MINIO_BUCKET_NAME: ccaibucket
      MINIO_USE_SSL: "false"
      MILVUS_JEMALLOC_ENABLED: "false"
    volumes:
      - ./data/milvus:/var/lib/milvus
      - ./data/milvus/configs/embedEtcd.yaml:/milvus/configs/embedEtcd.yaml
      - ./data/milvus/configs/user.yaml:/milvus/configs/user.yaml
      - ./data/milvus/configs/milvus.yaml:/milvus/configs/milvus.yaml
    security_opt:
      - seccomp:unconfined
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9091/healthz"]
      interval: 30s
      start_period: 90s
      timeout: 20s
      retries: 3
    ports:
      - "19530:19530"    # gRPC
      - "9091:9091"     # HTTP/health

  nginx:
    container_name: cc-nginx
    privileged: true
    restart: always
    image: nginx:1.29.6
    ports:
      - "80:80"
      - "8378:8378"
    networks:
      - cc-net
    volumes:
      - ./data/nginx/:/etc/nginx
      - ./data/nginx/logs:/var/log/nginx


networks:
  cc-net:
    external: true
