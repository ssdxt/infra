version: '3.7'
# ==============================================================================
#  GLM-4-9B-Chat  (MindIE 1.0.0 + Atlas 300I Duo 310P3) —— 修正版
#
#  原文件 docker-compose.yml 原样保留、未改动；本文件是可直接用的替代版本。
#  文件名带 .fixed 不会被自动识别，必须显式 -f 指定，不会跟原文件打架。
#
#  启动   : cd /deploy/models/docker_run/vllm
#           sudo docker-compose -f docker-compose.fixed.yml up -d
#  看日志 : sudo docker-compose -f docker-compose.fixed.yml logs -f
#           或  sudo tail -f /deploy/logs/mindie/glm-4.log
#  停止   : sudo docker-compose -f docker-compose.fixed.yml down
#
# ==============================================================================
#  一、原文件为什么起不来（全部是实测报错原文）
#
#  1) Check path: config.json failed, by: Check Other group permission failed:
#     Current permission is 4, but required no greater than 0.
#     Required permission: 640, but got 644
#
#  2) Check path: config.json failed, by:owner id diff:
#     current process user id is 0, file owner id is 1000
#
#  3) [backend_manager] Backend library is not invalid:Check path:
#     libmindieservice_llm_engine.so failed, by:owner id diff:
#     current process user id is 0, file owner id is 1000
#
#  MindIE 是安全加固版：凡它要读的文件都强制「属主 == 进程用户」且「权限 <= 640」。
#  而镜像内所有文件属主都是 uid=1000，compose 默认却以 root(0) 跑 —— 必然全挂。
#  正确做法：让容器以 uid=1000 跑，而不是去 chown 镜像里的文件。
#
#  4) 容器一直显示 Up，但里面 daemon 早死了：
#     原命令 `... & tail -f /dev/null` 让 PID1 永远不退出，restart: always 永不触发，
#     docker logs 也是空的（日志被重定向到容器根目录的 glm-4.log）。
#
# ==============================================================================
#  二、相对原文件改了 8 处
#
#   1. user: "1000:0"                     以镜像自带属主运行，过掉 1)2)3)
#   2. group_add: ["1001"]                宿主机 /dev/davinci* 属主 HwHiAiUser(1001)/660
#   3. working_dir: .../mindie-service    config.json 里 security/、logs/ 是相对路径
#   4. 只挂 conf/config.json 单文件        原写法挂整个 conf 目录，会遮蔽镜像自带的
#                                         machine_config/、model_config/ 等
#   5. 补 /dev/davinci0、/dev/davinci1     原写法只挂 manager/hdc/svm，两颗芯片本体没进去
#   6. 日志落到 /deploy/logs/mindie/       原写法 docker logs 永远为空，没法排查
#   7. 去掉 tail -f /dev/null              daemon 死了容器就退出，restart: always 才生效
#   8. runtime: runc                      防止全局 default-runtime 改回 ascend 后报
#                                         "config.json: write permission not right"
#
# ==============================================================================
#  三、一次性权限准备（compose 语法表达不了，必须手工执行一次）
#
#    sudo mkdir -p /deploy/logs/mindie
#    sudo chown -R 1000:0 /deploy/logs/mindie
#    sudo chown 1000:0 /deploy/models/glm-4-9b-chat/conf/config.json
#    sudo chmod 640    /deploy/models/glm-4-9b-chat/conf/config.json
#    sudo chown 1000:0 /deploy/models/glm-4-9b-chat/config.json
#    sudo chmod 640    /deploy/models/glm-4-9b-chat/config.json
#
# ==============================================================================
#  四、启动命令里为什么是 `daemon | tee` 而不是 `daemon &`
#
#  MindIE daemon 会 setpgid；当它是 PID 1（会话首进程）时 setpgid 会 EPERM，
#  报 "Failed to set process group. error: 1"。用管道让它成为 bash 的子进程即可，
#  同时 tee 还能把日志同时送到 docker logs 和宿主机文件。
# ==============================================================================

services:
  glm-4-9b-chat:
    container_name: glm-4-9b-chat
    image: swr.cn-south-1.myhuaweicloud.com/ascendhub/mindie:1.0.0-300I-Duo-py311-openeuler24.03-lts
    restart: always
    network_mode: host
    privileged: true
    tty: true
    stdin_open: true

    runtime: runc
    user: "1000:0"
    group_add:
      - "1001"

    environment:
      - TZ=Asia/Shanghai
      # 崩溃时收集 NPU 侧 plog，方便定位 aicore / runtime 故障
      - ASCEND_PROCESS_LOG_PATH=/deploy/logs/mindie/ascend

    working_dir: /usr/local/Ascend/mindie/latest/mindie-service

    volumes:
      - /usr/local/Ascend/driver:/usr/local/Ascend/driver:ro
      - /usr/local/sbin:/usr/local/sbin:ro
      - /deploy/models/glm-4-9b-chat:/deploy/models/glm-4-9b-chat:rw
      - /dev/davinci0:/dev/davinci0
      - /dev/davinci1:/dev/davinci1
      - /dev/davinci_manager:/dev/davinci_manager
      - /dev/hisi_hdc:/dev/hisi_hdc
      - /dev/devmm_svm:/dev/devmm_svm
      - /deploy/models/glm-4-9b-chat/conf/config.json:/usr/local/Ascend/mindie/latest/mindie-service/conf/config.json:ro
      - /deploy/logs/mindie:/deploy/logs/mindie:rw

    shm_size: 50g
    stop_grace_period: 60s

    command: >
      bash -c ": > /deploy/logs/mindie/glm-4.log;
               cd /usr/local/Ascend/mindie/latest/mindie-service &&
               ./bin/mindieservice_daemon 2>&1 | tee -a /deploy/logs/mindie/glm-4.log"
