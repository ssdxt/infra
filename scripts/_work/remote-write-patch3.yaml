spec:
  remoteWrite:
  - url: http://10.100.10.29:9091/api/v1/write
    remoteTimeout: 60s
    writeRelabelConfigs:
    # ---- 1) 只推 10 个集群 job ----
    - action: keep
      regex: (kubelet|node-exporter|kube-state-metrics|apiserver|etcd|kube-scheduler|kube-controller-manager|coredns|prometheus-stack-kube-prom-prometheus|prometheus-stack-kube-prom-alertmanager|prometheus-stack-kube-prom-operator)
      sourceLabels: [job]
    # ---- 2) 丢掉直方图桶(约 11.7 万序列, 占集群 190k 的 62%) ----
    #        注意: 必须写 .*_bucket 而不是 _bucket$ ——
    #        实测 remote_write 的 writeRelabelConfigs 里 '$' 锚点不生效(原因未明),
    #        用 .*_bucket 已验证可靠。
    - action: drop
      regex: '.*_bucket'
      sourceLabels: [__name__]
    # ---- 3) 丢掉恒定值、无告警价值的枚举指标(5077 序列) ----
    - action: drop
      regex: 'kubernetes_feature_enabled'
      sourceLabels: [__name__]
    # ---- 4) 丢掉"派生序列", 避免与 plant01 自己算的同名序列时间戳打架 ----
    #        plant01 已加载集群的 230 条规则, 会对推来的原始指标自行求值,
    #        因此集群自己算出来的这几类序列【不需再推】:
    #          · ALERTS / ALERTS_FOR_STATE : 告警状态由 Alertmanager 链路负责
    #          · count:up0 / count:up1      : kube-prometheus-stack 的常量记录规则,
    #                                         两边同名会触发 out-of-order 报错
    #        实测: 过滤前每 10 分钟约 8 条 out-of-order; 过滤后应为 0。
    - action: drop
      regex: 'ALERTS|ALERTS_FOR_STATE|count:up0|count:up1'
      sourceLabels: [__name__]
