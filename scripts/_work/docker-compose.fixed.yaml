# =============================================================================
#  Milvus 2.6.9 standalone —— 本地存储版（不需要 MinIO / S3）
#
#  原文件 docker-compose.yaml 原样保留、未改动。
#  用法：cd /deploy/infra/milvus
#        sudo docker-compose -f docker-compose.fixed.yaml up -d
#        sudo docker-compose -f docker-compose.fixed.yaml logs -f standalone
#
#  -----------------------------------------------------------------------------
#  原文件为什么会卡在 health: starting
#
#    1) minio 服务整段被注释掉了，没有任何 S3 对象存储；
#    2) MINIO_ADDRESS 却还写着 172.18.0.15:9000 —— 那是 manualai_network 的地址，
#       而该网络根本不存在，容器实际在 deploy-net(172.30.0.0/16)；
#    3) Milvus 强依赖对象存储存 segment/binlog/index，连不上就一路报：
#
#       ["failed to check blob bucket exist"] [error="Get
#        http://172.18.0.15:9000/milvus/?location=: dial tcp i/o timeout"]
#       ["fail to apply balance"] [error="fail to balance: no available streaming node"]
#       ["check health failed"] [UnhealthyComponent="[querynode,proxy,streamingnode]"]
#
#  -----------------------------------------------------------------------------
#  修复思路：不要 MinIO，直接用 Milvus 2.6 自带的本地存储
#
#    直接改原配置文件 ./data/milvus/milvus.yaml（目录结构保持原样，未新增外部配置文件）
#    改了两处 —— 原配置本来就有这两个开关：
#       common.storageType:        remote -> local
#       woodpecker.storage.type:   minio  -> local
#    配合 localStorage.path = /var/lib/milvus/data/（已挂到宿主机持久化目录）
#
#    这样数据直接落本地文件系统，woodpecker(内部 WAL) 也用本地盘，
#    既不需要 MinIO，也不需要 Pulsar/Kafka。
#
#    原始配置已备份为 ./data/milvus/milvus.yaml.bak-<时间戳>
# =============================================================================

services:
  etcd:
    container_name: milvus-etcd
    image: swr.cn-north-4.myhuaweicloud.com/ddn-k8s/registry.k8s.io/etcd:3.5.6-0-linuxarm64
    restart: always
    privileged: true
    runtime: runc
    environment:
      - ETCD_AUTO_COMPACTION_MODE=revision
      - ETCD_AUTO_COMPACTION_RETENTION=1000
      - ETCD_QUOTA_BACKEND_BYTES=4294967296
      - ETCD_SNAPSHOT_COUNT=50000
    volumes:
      - ./data/milvus/volumes/etcd:/etcd
    command: etcd -advertise-client-urls=http://etcd:2379 -listen-client-urls http://0.0.0.0:2379 --data-dir /etcd
    healthcheck:
      test: ["CMD", "etcdctl", "endpoint", "health"]
      interval: 30s
      timeout: 20s
      retries: 3
    networks:
      deploy-net:
        ipv4_address: 172.30.0.13

  standalone:
    container_name: milvus-standalone
    image: swr.cn-north-4.myhuaweicloud.com/ddn-k8s/docker.io/milvusdb/milvus:v2.6.9-linuxarm64
    restart: always
    privileged: true
    runtime: runc
    command: ["milvus", "run", "standalone"]
    security_opt:
      - seccomp:unconfined
    environment:
      ETCD_ENDPOINTS: etcd:2379
      MQ_TYPE: woodpecker
      # 删掉了 MINIO_ADDRESS / MINIO_BUCKET_NAME / MINIO_ACCESS_KEY / MINIO_SECRET_KEY
      # —— storageType=local 之后不再需要对象存储
    volumes:
      - ./data/milvus/volumes/milvus:/var/lib/milvus
      - ./data/milvus/user.yaml:/milvus/configs/user.yaml
      # 沿用原目录结构：直接挂 data/milvus/milvus.yaml（已改为 local 存储）
      - ./data/milvus/milvus.yaml:/milvus/configs/milvus.yaml
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9091/healthz"]
      interval: 30s
      start_period: 120s
      timeout: 20s
      retries: 5
    ports:
      - "19530:19530"
      - "9091:9091"
    depends_on:
      - etcd
    networks:
      deploy-net:
        ipv4_address: 172.30.0.14

networks:
  deploy-net:
    external: true
