# =============================================================================
# HTTP -> HTTPS 自动跳转：浏览器输入 http://<ip>/ 时 301 到 https
# =============================================================================
server {
    listen 80 default_server;
    server_name _;
    return 301 https://$host$request_uri;
}

# =============================================================================
# omniknow 统一入口：443 HTTPS
#   /       -> 前端静态（/usr/share/nginx/html，来自 /deploy/code/web_0918 挂载）
#   /api/   -> api    https://127.0.0.1:8261/（剥前缀；JS 侧 base_api='/api'）
#   /voice/ -> speech https://127.0.0.1:7870/（剥前缀；JS 侧 voice_api='/voice'）
# 设计要点：
#   - proxy_buffering off：RAG 问答是 SSE 流式（P50 16.5s），必须逐块透传
#   - read/send 600s：3D 转换/长问答/大文件上传的余量
#   - client_max_body_size 500m：知识库文档 + 语音文件上传
#   - proxy_ssl_verify off：上游 api/speech 均为自签 HTTPS
#   - index.html 不缓存：避免换环境后浏览器拿旧配置（历史踩坑）
# =============================================================================
server {
    listen 443 ssl default_server;
    server_name _;

    ssl_certificate     /etc/nginx/certs/omniknow.crt;
    ssl_certificate_key /etc/nginx/certs/omniknow.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:SSL:10m;

    # ---- 上游通用代理设置 ----
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_ssl_verify off;
    proxy_buffering off;                 # SSE 流式必须关缓冲
    proxy_read_timeout  600s;
    proxy_send_timeout  600s;
    client_max_body_size 500m;

    # ---- API（剥掉 /api 前缀转给 8261） ----
    location /api/ {
        proxy_pass https://127.0.0.1:8261/;
    }

    # ---- 语音（剥掉 /voice 前缀转给 7870） ----
    location /voice/ {
        proxy_pass https://127.0.0.1:7870/;
    }

    # ---- 3D 模型编辑器静态站（/model-editor；站点在 /deploy/code/web_model） ----
    # ^~ 优先前缀：阻断主站静态缓存正则location截胡本目录的 js/css
    # 注意：try_files 不要用 $uri/ 目录分支——目录内部重定向会丢前缀落到主站；fallback 必须带 /model-editor/ 前缀
    location = /model-editor { return 301 /model-editor/; }
    location ^~ /model-editor/ {
        rewrite ^/model-editor/(.*)$ /$1 break;
        root /usr/share/nginx/me-root;
        index index.html;
        try_files $uri /model-editor/index.html;
    }

    # ---- 前端静态 ----
    location / {
        root  /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
    }
    # index.html 不缓存（换环境/改配置后浏览器立即生效）
    location = /index.html {
        root  /usr/share/nginx/html;
        add_header Cache-Control "no-cache, must-revalidate";
    }
    # 静态资源长缓存（带 hash 文件名，安全）
    location ~* \.(js|css|png|jpg|jpeg|gif|svg|ico|woff2?|ttf|model|glb)$ {
        root  /usr/share/nginx/html;
        expires 7d;
        add_header Cache-Control "public";
    }
}
