# =============================================================================
# omniknow-1.0 全栈总控编排 v3 —— nginx 443 统一入口版
# -----------------------------------------------------------------------------
# 形态：容器=进程壳（不打镜像、宿主内容全挂载）
# 入口：https://<任意IP或localhost>/  （nginx 443 统一代理，换网络环境零改动）
#   /        -> 前端静态文件（web_0918 由 nginx 直出，不再需要 https_server.py）
#   /api/    -> api   https://127.0.0.1:8261/（剥掉 /api 前缀）
#   /voice/  -> speech https://127.0.0.1:7870/（剥掉 /voice 前缀）
# 顺序链：oceanbase -> embed -> reranker -> glm -> api -> speech -> gateway
#         （串行链，任一时刻最多一个重载服务，防 CPU 打满/加载风暴）
# 错峰双保险：depends_on(service_healthy) 管 compose up；command 内 sleep 管机器
#         重启后 restart 策略同时拉起（不走 depends_on 排序）的场景。
# modelTranslator：非常驻服务，是 api 的 3D 转换子进程（file_process_api 以
#         subprocess 调用），二进制 RUNPATH=$ORIGIN/../lib 自寻 lib，
#         经 api 容器挂载 /deploy/code/modelTranslator 即可，无需独立容器。
# =============================================================================

name: omniknow1

services:

  # ---------------------------------------------------------------- 1/7 数据库
  oceanbase-ce:
    image: swr.cn-north-4.myhuaweicloud.com/ddn-k8s/quay.io/oceanbase/oceanbase-ce:4.3.3.0-100000142024101215-linuxarm64
    container_name: oceanbase-ce
    privileged: true
    restart: unless-stopped
    ports:
      - "2881:2881"
      - "2882:2882"
    ulimits:
      nofile: { soft: 65536, hard: 65536 }
      nproc: { soft: 120000, hard: 120000 }
    environment:
      MODE: mini
      OB_SYS_PASSWORD: "12345"
      OB_TENANT_PASSWORD: "12345"
      OB_MEMORY_LIMIT: "8G"
      OB_SYSTEM_MEMORY: "2G"
      OB_DATAFILE_SIZE: "20G"
      OB_LOG_DISK_SIZE: "20G"
    volumes:
      - /deploy/infra/oceanbase/ob:/root/ob
      - /deploy/infra/oceanbase/obd/repository:/root/.obd/repository
      - /deploy/infra/oceanbase/obd/cluster:/root/.obd/cluster
      - /deploy/infra/oceanbase/templates/observer-template.yaml:/root/templates/observer-template.yaml:ro
      - /deploy/infra/oceanbase/limits-nofile.conf:/etc/security/limits.d/99-nofile.conf:ro
    networks:
      obnet:
        ipv4_address: ${OB_STATIC_IP:-172.20.0.2}   # 集群元数据绑定此 IP，勿改
    healthcheck:
      test: ["CMD-SHELL", "obclient -h127.0.0.1 -P2881 -uroot@test -p12345 -e 'select 1'"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 180s

  # ---------------------------------------------------------------- 2/7 向量
  embed:
    image: swr.cn-south-1.myhuaweicloud.com/ascendhub/mis-tei:7.1.RC1-300I-Duo-aarch64
    container_name: embed
    network_mode: host
    privileged: true
    user: root
    restart: always                # 与现役容器一致（2026-09-20 排查核实）
    stdin_open: true
    tty: true
    depends_on:
      oceanbase-ce:
        condition: service_healthy
    environment:
      - TEI_NPU_DEVICE=0
      - HOME=/home/HwHiAiUser
      - MODEL_MEMORY_LIMIT=2048
      - LISTEN_IP=0.0.0.0
      - LISTEN_PORT=8105
    volumes:
      - /deploy/models:/home/HwHiAiUser/model
      - /usr/local/bin/npu-smi:/usr/local/bin/npu-smi
      - /usr/local/Ascend/driver:/usr/local/Ascend/driver
    entrypoint: /home/HwHiAiUser/start.sh
    command: ["/deploy/models/bge-m3", "0.0.0.0", "8105"]
    healthcheck:
      test: ["CMD-SHELL", "curl -sf -m 5 http://127.0.0.1:8105/health || exit 1"]
      interval: 10s
      timeout: 8s
      retries: 12
      start_period: 90s

  # ---------------------------------------------------------------- 3/7 重排
  bge-reranker-v2-m3:
    image: swr.cn-south-1.myhuaweicloud.com/ascendhub/mis-tei:7.1.RC1-300I-Duo-aarch64
    container_name: bge-reranker-v2-m3
    network_mode: host
    privileged: true
    user: root
    restart: always                # 与现役容器一致（2026-09-20 排查核实）
    stdin_open: true
    tty: true
    depends_on:
      embed:
        condition: service_healthy
    environment:
      - TEI_NPU_DEVICE=1
      - HOME=/home/HwHiAiUser
      - MODEL_MEMORY_LIMIT=2048
      - LISTEN_IP=0.0.0.0
      - LISTEN_PORT=8106
    volumes:
      - /deploy/models:/home/HwHiAiUser/model
      - /usr/local/bin/npu-smi:/usr/local/bin/npu-smi
      - /usr/local/Ascend/driver:/usr/local/Ascend/driver
    entrypoint: /home/HwHiAiUser/start.sh
    command: ["/deploy/models/bge-reranker-v2-m3", "0.0.0.0", "8106"]
    healthcheck:
      test: ["CMD-SHELL", "curl -sf -m 5 http://127.0.0.1:8106/health || exit 1"]
      interval: 10s
      timeout: 8s
      retries: 12
      start_period: 90s

  # ---------------------------------------------------------------- 4/7 主模型
  glm-4-chat-9b:
    image: swr.cn-south-1.myhuaweicloud.com/ascendhub/mindie:1.0.0-300I-Duo-py311-openeuler24.03-lts
    container_name: glm-4-chat-9b
    network_mode: host
    privileged: true
    restart: always                 # 与现役容器一致（2026-09-20 排查核实）
    tty: true
    stdin_open: true
    depends_on:
      bge-reranker-v2-m3:
        condition: service_healthy
    environment:
      - TZ=Asia/Shanghai
    volumes:
      - /usr/local/Ascend/driver:/usr/local/Ascend/driver:ro
      - /usr/local/sbin:/usr/local/sbin:ro
      - /deploy/models/glm-4-9b-chat:/deploy/models/glm-4-9b-chat:rw
      - /dev/davinci_manager:/dev/davinci_manager
      - /dev/hisi_hdc:/dev/hisi_hdc
      - /dev/devmm_svm:/dev/devmm_svm
      - /deploy/models/glm-4-9b-chat/conf:/usr/local/Ascend/mindie/latest/mindie-service/conf:rw
    shm_size: 32g
    # sleep 20：reranker healthy 后再错峰；重启风暴场景下也推迟 NPU 大分配
    command: sh -c "sleep 20 && nohup /usr/local/Ascend/mindie/latest/mindie-service/bin/mindieservice_daemon > glm-4.log 2>&1 & tail -f /dev/null"
    healthcheck:
      test: ["CMD-SHELL", "curl -s -m 8 -H 'Authorization: Bearer cc' -o /dev/null -w '%{http_code}' http://127.0.0.1:10006/v1/models | grep -q 200"]
      interval: 20s
      timeout: 12s
      retries: 30
      start_period: 600s          # 权重加载 35s~2min，留足余量

  # ---------------------------------------------------------------- 5/7 API 主服务
  api:
    image: swr.cn-north-4.myhuaweicloud.com/ddn-k8s/docker.io/ubuntu:22.04-linuxarm64
    container_name: omniknow-api
    network_mode: host
    privileged: true
    restart: unless-stopped
    depends_on:
      oceanbase-ce:
        condition: service_healthy
      glm-4-chat-9b:
        condition: service_healthy
    environment:
      - PATH=/opt/lo-bin:/root/anaconda3/envs/recovery/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
      # 注意顺序：conda/昇腾库在前，mt-libs 兜底在后（避免遮蔽 conda 自带库）
      # lo-libs 不放全局：由 /opt/lo-bin/soffice wrapper 仅对 LibreOffice 进程树注入，避免与 conda 的 libffi 符号冲突
      - LD_LIBRARY_PATH=/usr/local/Ascend/driver/lib64:/usr/local/Ascend/driver/common:/usr/local/Ascend/ascend-toolkit/latest/lib64:/root/anaconda3/envs/recovery/lib:/opt/mt-libs
      - ASCEND_RT_VISIBLE_DEVICES=0
      - HOME=/root
    volumes:
      # conda 环境"同路径"挂载：pip 脚本 shebang 不变，免 conda activate
      - /root/anaconda3/envs/recovery:/root/anaconda3/envs/recovery
      - /usr/local/Ascend/driver:/usr/local/Ascend/driver:ro
      - /usr/local/Ascend/ascend-toolkit:/usr/local/Ascend/ascend-toolkit:ro
      - /deploy/code/chat_doc_0918:/deploy/code/chat_doc_0918
      # modelTranslator（3D转换CLI，api 子进程调用；RUNPATH=$ORIGIN/../lib 自寻依赖）
      - /deploy/code/modelTranslator:/deploy/code/modelTranslator
      # 容器缺的系统库（25个：X11/tk 链 + freeimage 链，来自宿主拷贝，不含 libc/libstdc++）
      - ./modeltranslator-libs:/opt/mt-libs:ro
      # LibreOffice 办公文档转 PDF（含中文字体与 fontconfig 配置；NSS softoken 全家已补齐）
      - ./lo-extras/libreoffice:/usr/lib/libreoffice:ro
      - ./lo-extras/bin:/opt/lo-bin:ro
      - ./lo-extras/fonts:/usr/share/fonts:ro
      - ./lo-extras/etc-fonts:/etc/fonts:ro
      - ./lo-extras/lib:/opt/lo-libs:ro
      - /deploy/cc/logs:/deploy/cc/logs
    working_dir: /deploy/code/chat_doc_0918
    # sleep 30：等 GLM 完全就绪后错峰起 API（uvicorn 抢 CPU 与模型加载错开）
    # 日志直接进 docker logs，不落文件
    command: >
      bash -lc 'sleep 30;
                exec /root/anaconda3/envs/recovery/bin/python startup_obd.py --all-api'
    healthcheck:
      test: ["CMD-SHELL", "/root/anaconda3/envs/recovery/bin/python -c \"import urllib.request,ssl; urllib.request.urlopen('https://127.0.0.1:8261/docs', timeout=8, context=ssl._create_unverified_context())\""]
      interval: 15s
      timeout: 12s
      retries: 8
      start_period: 180s

  # ---------------------------------------------------------------- 6/7 语音
  speech:
    image: swr.cn-north-4.myhuaweicloud.com/ddn-k8s/docker.io/ubuntu:22.04-linuxarm64
    container_name: omniknow-speech
    network_mode: host
    privileged: true
    restart: unless-stopped
    shm_size: 8g
    depends_on:
      api:
        condition: service_healthy
    environment:
      - PATH=/opt/extras/bin:/root/anaconda3/envs/melo_tts/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
      # 昇腾环境不在这里手动拼：命令内 source 宿主同款 set_env.sh（nnrt/toolkit/atb/toolbox），
      # 与宿主 /root/.bashrc 行为完全一致
      - LD_LIBRARY_PATH=/root/anaconda3/envs/melo_tts/lib:/opt/extras/lib
      - ASCEND_RT_VISIBLE_DEVICES=0            # 容器内仅逻辑设备0/1有效（6在容器里段错误）；宿主原形态也在芯片0
      - NLTK_DATA=/deploy/code/melott/nltk_data/
      - HOME=/root
    volumes:
      - /root/anaconda3/envs/melo_tts:/root/anaconda3/envs/melo_tts
      # 整个 Ascend 只读挂载（driver/toolkit/nnrt/nnal/toolbox 全含，set_env.sh 就在里面）
      - /usr/local/Ascend:/usr/local/Ascend:ro
      - /deploy/code/melott:/deploy/code/melott
      # ASR/TTS 模型（funasr 的 iic/* 与 melo 权重都在这里）
      - /deploy/models:/deploy/models:ro
      # ffmpeg + 依赖（pydub/ASR 音频解码用，来自宿主拷贝）
      - ./extras/bin:/opt/extras/bin:ro
      - ./extras/lib:/opt/extras/lib:ro
      - /deploy/cc/logs:/deploy/cc/logs
    working_dir: /deploy/code/melott
    # sleep 30 错峰；随后 source 宿主同款昇腾环境（与 /root/.bashrc 一致），再起服务
    command: ["bash", "-lc", "sleep 30; source /usr/local/Ascend/nnrt/set_env.sh >/dev/null 2>&1; source /usr/local/Ascend/ascend-toolkit/set_env.sh >/dev/null 2>&1; source /usr/local/Ascend/nnal/atb/set_env.sh >/dev/null 2>&1; source /usr/local/Ascend/toolbox/set_env.sh >/dev/null 2>&1; exec /root/anaconda3/envs/melo_tts/bin/python web_demo_seaco.py"]
    healthcheck:
      test: ["CMD-SHELL", "/root/anaconda3/envs/melo_tts/bin/python -c \"import urllib.request,ssl; urllib.request.urlopen('https://127.0.0.1:7870/docs', timeout=8, context=ssl._create_unverified_context())\""]
      interval: 20s
      timeout: 12s
      retries: 15
      start_period: 600s

  # ---------------------------------------------------------------- 7/7 统一入口（443）
  gateway:
    image: nginx:alpine
    container_name: omniknow-gateway
    network_mode: host
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
      speech:
        condition: service_healthy
    volumes:
      - /deploy/code/web_0918:/usr/share/nginx/html:ro        # 前端静态直出（替代 https_server.py）
      - /deploy/code/web_model:/usr/share/nginx/me-root:ro   # 3D 模型编辑器静态站（/model-editor）
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./nginx/certs:/etc/nginx/certs:ro
      # 不挂日志目录：镜像自带 /dev/stdout 符号链接，访问/错误日志直接进 docker logs
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null --no-check-certificate https://127.0.0.1/ || exit 1"]
      interval: 20s
      timeout: 10s
      retries: 5
      start_period: 30s

networks:
  obnet:
    driver: bridge
    ipam:
      config:
        - subnet: ${OB_SUBNET:-172.20.0.0/24}
          gateway: ${OB_GATEWAY:-172.20.0.1}
