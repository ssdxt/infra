networks:
    gptnetwork:
        external: true
        name: work_gptnetwork
services:
    holarasr:
        container_name: holarasr
        deploy:
            resources:
                limits:
                    cpus: ${CPUS}
                    memory: ${MEMORY_LIMIT}
        extra_hosts:
            - host.docker.internal:host-gateway
        image: docker.holardata.com:5100/box/holarasr:v1.1.0
        networks:
            - gptnetwork
        ports:
            - ${HOST_IP}:${PANEL_APP_PORT_HTTPS}:8333
            - ${HOST_IP}:${WEBSOCKET_PORT_HTTP}:8765
            - ${HOST_IP}:8764:8764
            - ${HOST_IP}:8763:10095
        privileged: true
        restart: "no"
        volumes:
            - /etc/localtime:/etc/localtime:ro
            - /etc/timezone:/etc/timezone:ro
            - /etc/nginx/conf.d/holardata.com.pem:/etc/nginx/conf.d/holardata.com.pem:ro
            - /etc/nginx/conf.d/holardata.com.key:/etc/nginx/conf.d/holardata.com.key:ro
            - /root/.cache/modelscope/hub/models/iic/speech_fsmn_vad_zh-cn-16k-common-pytorch/config.yaml:/workspace/models/damo/speech_fsmn_vad_zh-cn-16k-common-onnx/config.yaml:ro
            - /root/box_manager/asr_param/hotwords.txt:/workspace/models/hotwords.txt:ro
