version: "3.8"

services:
  embed:
    build: .                    # 自动用当前目录的 Dockerfile 构建镜像
    image: my-pytorch-embed     # 构建后的镜像名
    container_name: pytorch-embed
    runtime: nvidia             # 等价于 --gpus all
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
    volumes:
      - /root/embed:/workspace/embed
    ports:
      - "6208:6208"
    command: python3 /workspace/embed/localembedding-bce-embedding-base_v1.py
    stdin_open: true            # 等价于 -i
    tty: true                   # 等价于 -t
    networks:
      - models_network          # 服务连接到外部网络

networks:
  models_network:
    external: true
    name: models_network