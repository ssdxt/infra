# =============================================================================
# OceanBase 容器化启动（固化版）—— 与 docker-run.sh 参数一一对应
# -----------------------------------------------------------------------------
# 设计目标：
#   1. 宿主机 IP 变化不影响集群（容器固定 IP 与宿主 IP 无关，端口发布绑 0.0.0.0）
#   2. 容器重建后 OBD 集群身份不丢（固定 IP + 持久化挂载）
#
# ⚠️ 首次在本机激活前必读（README.md「三、激活路径」）：
#   现有集群数据绑定在 172.17.0.2。本 compose 默认网段 172.20.0.0/24，
#   固定 IP 172.20.0.2 —— 直接 up 会让 OB 换 IP，导致旧数据元数据失联。
#   三选一：README 中的 路径1(推荐) / 路径2 / 路径3(新环境直接用)。
#
# 网段/IP 通过 .env 覆盖：
#   OB_SUBNET / OB_GATEWAY / OB_STATIC_IP
# =============================================================================

name: oceanbase

services:
  oceanbase-ce:
    image: swr.cn-north-4.myhuaweicloud.com/ddn-k8s/quay.io/oceanbase/oceanbase-ce:4.3.3.0-100000142024101215-linuxarm64
    container_name: oceanbase-ce
    privileged: true
    restart: unless-stopped
    ports:
      - "2881:2881"     # MySQL 协议（绑 0.0.0.0，宿主 IP 变化无影响）
      - "2882:2882"     # RPC
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
      nproc:
        soft: 120000
        hard: 120000
    environment:
      MODE: mini
      OB_SYS_PASSWORD: "12345"
      OB_TENANT_PASSWORD: "12345"
      OB_MEMORY_LIMIT: "8G"
      OB_SYSTEM_MEMORY: "2G"
      OB_DATAFILE_SIZE: "20G"
      OB_LOG_DISK_SIZE: "20G"
    volumes:
      - /deploy/infra/oceanbase/ob:/root/ob
      - /deploy/infra/oceanbase/obd:/root/.obd
      - /deploy/infra/oceanbase/templates/observer-template.yaml:/root/templates/observer-template.yaml:ro
      - /deploy/infra/oceanbase/limits-nofile.conf:/etc/security/limits.d/99-nofile.conf:ro
    networks:
      obnet:
        ipv4_address: ${OB_STATIC_IP:-172.20.0.2}
    healthcheck:
      test: ["CMD-SHELL", "obclient -h127.0.0.1 -P2881 -uroot@test -p12345 -e 'select 1'"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 180s

networks:
  obnet:
    driver: bridge
    ipam:
      config:
        - subnet: ${OB_SUBNET:-172.20.0.0/24}
          gateway: ${OB_GATEWAY:-172.20.0.1}
